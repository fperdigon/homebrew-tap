name: CI

on:
  push:
  pull_request:

jobs:
  cask:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew
        run: brew update
      - name: Check cask style
        run: brew style --except-cops Cask/InstallSteps Casks/
      - name: Check Ruby syntax
        run: for cask in Casks/*.rb; do ruby -c "$cask"; done
      - name: Audit casks
        continue-on-error: true
        run: for cask in Casks/*.rb; do brew audit --cask --online "$cask"; done
